  const root=document.getElementById('sx-redesign');

  function modelMenu(app){const s=state.get(app);sheet(app,'模型菜单',modelList(s),button('完成','close','sx-button sx-primary'),'YOUR MODELS')}
  function provider(app,name){const s=state.get(app);s.provider=name;sheet(app,name,`<div class="sx-row" style="margin-bottom:22px">${symbol(name)}<span class="sx-pill">${name==='ChatGPT'?'订阅连接':'API 连接'}</span></div><label class="sx-field">连接名称<input name="connection-name" class="sx-input" value="${name}" ${s.running?'disabled':''}></label>${name==='ChatGPT'?'<label class="sx-field">绑定账号<select class="sx-select" '+(s.running?'disabled':'')+'><option>个人账号 · 演示工作区</option><option>跟随 Codex 登录</option></select><span class="sx-helper">保存绑定用于下次发布，不切换 Codex 原生登录。</span></label>':'<label class="sx-field">API 地址<input class="sx-input" value="https://api.deepseek.com" '+(s.running?'disabled':'')+'></label><label class="sx-field">API Key<input class="sx-input" type="password" placeholder="已保存 · 留空保留" autocomplete="off" '+(s.running?'disabled':'')+'><span class="sx-helper">设计预览使用占位凭据。</span></label>'}<div class="sx-detail-line"><span>模型映射</span>${button('查看 2 个模型 '+icon('chevron-right'),'models','sx-ghost')}</div>${button(icon('activity')+'检查连接','check-provider','sx-button','style="margin-top:22px" '+(s.running?'disabled':''))}${s.running?'<div class="sx-notice">当前路由正在使用此连接。编辑前需恢复并停止。</div>':''}`,button(s.running?'关闭':'保存连接',s.running?'close':'save-provider','sx-button sx-primary')+(name==='DeepSeek'&&!s.running?button('预览直连','direct','sx-button'):'')+'<p>保存与启用是两个独立操作</p>','CONNECTION')}
  function account(app){const s=state.get(app);sheet(app,'订阅账号',`<div class="sx-row" style="margin-bottom:24px"><span class="sx-avatar">P</span><div><strong>个人账号</strong><p class="sx-helper">演示工作区 · 1 个连接使用中</p></div></div><div class="sx-detail-line"><span>绑定连接</span><span>ChatGPT</span></div><div class="sx-detail-line"><span>账号资料</span><span>私有文件保存</span></div><div class="sx-notice">连接绑定与 Codex 入口登录分开管理。修改入口登录前，会先检查和恢复受管配置。</div>${button('导入当前 Codex 账号','import-account','sx-button',s.running?'disabled':'')}`,button('关闭','close','sx-button sx-primary')+'<p>原型不读取或显示任何真实认证资料</p>','ACCOUNTS')}
  function restore(app){const s=state.get(app);sheet(app,'回到原来的配置。',`<p class="sx-helper">恢复启用前的 Codex 配置，并停止本地路由。</p><div class="sx-step"><span>1</span><div>检查外部修改<small>存在冲突时保留路由，逐项确认</small></div></div><div class="sx-step"><span>2</span><div>等待活动请求结束<small>完成配置恢复后停止路由</small></div></div><div class="sx-step"><span>3</span><div>清理本次发布<small>回到启用前的工作空间状态</small></div></div><div class="sx-notice">演示环境没有配置冲突，可直接恢复。</div>`,button('恢复并停止','confirm-restore','sx-button sx-primary')+button('取消','close','sx-button'),'RESTORE')}
  function addProvider(app){sheet(app,'添加一个连接',`<p class="sx-helper">先选连接类型，再补充必要信息。</p><label class="sx-field">连接类型<select class="sx-select" name="provider-type"><option>Responses API</option><option>ChatGPT 订阅</option></select></label><label class="sx-field">显示名称<input class="sx-input" name="new-provider-name" placeholder="例如：我的工作连接"></label><div class="sx-notice">下一步进入对应类型的编辑器，保存后再选择要发布的模型。</div>`,button('下一步 '+icon('arrow-right'),'provider-next','sx-button sx-primary'),'NEW CONNECTION')}
  function addModel(app){const s=state.get(app);if(s.running)return;sheet(app,'添加模型',`<label class="sx-field">所属连接<select class="sx-select" name="new-model-provider"><option>DeepSeek</option><option>ChatGPT</option></select></label><label class="sx-field">模型 ID<input class="sx-input" name="new-model-id" placeholder="例如：my-model"></label><label class="sx-field">显示名称<input class="sx-input" name="new-model-name" placeholder="给模型起一个好记的名字"></label><p class="sx-helper">这是演示映射，添加后出现在当前方案的模型列表中。</p><p class="sx-helper" data-form-error role="alert"></p>`,button('添加到模型菜单','save-new-model','sx-button sx-primary'),'NEW MODEL')}
  function command(app){sheet(app,'快速操作',`<label class="sx-field">搜索页面或操作<input class="sx-input" name="command-search" placeholder="试试“连接”或“模型”"></label><div data-command-results>${pages.map(([id,label,ic])=>button(icon(ic)+`<span>${label}</span>`+icon('arrow-up-right'),'nav','sx-command-item',`data-page="${id}" data-search-label="${label}"`)).join('')}${button(icon('plus')+'<span>添加模型</span>','add-model','sx-command-item','data-search-label="添加模型"')}</div>`, '<p>Esc 关闭 · ⌘K / Ctrl+K 快速打开</p>','COMMAND MENU')}
  function showStatus(app){const s=state.get(app);sheet(app,'连接状态',`<div class="sx-row" style="margin-bottom:25px">${pill(s)}</div><div class="sx-detail-line"><span>目标</span><span>本机 Codex</span></div><div class="sx-detail-line"><span>已选模型</span><span>${getCount(s)} 个</span></div><div class="sx-detail-line"><span>配置</span><span>${s.running?'由 SwitchX 管理':'尚未修改'}</span></div><div class="sx-notice">${s.running?'模型和连接当前已锁定。需要调整时，先恢复并停止。':'准备好后可以预览发布，确认配置变化再启用。'}</div>`,button(s.running?'恢复并停止':'预览并启用',s.running?'restore':'preview','sx-button sx-primary'),'LOCAL STATUS')}
  root.querySelectorAll('.sx').forEach(app=>{state.set(app,{page:'home',models:originalModels.map(m=>({...m})),defaultId:'codex-main',filter:'all',running:false,direct:false,empty:false});base(app,state.get(app));app.addEventListener('pointerdown',()=>{activeApp=app})});
  root.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const app=target.closest('.sx');if(!app)return;activeApp=app;const s=state.get(app),action=target.dataset.action;
    if(action==='nav'){changePage(app,target.dataset.page);return}
    if(action==='settings'){changePage(app,'settings');return}
    if(action==='close'){closeSheet(app);return}
    if(action==='theme'){const light=app.style.colorScheme==='light'||(tweaks.appearance==='system'&&!matchMedia('(prefers-color-scheme:dark)').matches);tweaks.appearance=light?'dark':'light';appearance();save(app);return}
    if(action==='appearance'){tweaks.appearance=target.dataset.appearance;appearance();save(app);return}
    if(action==='filter'){s.filter=target.dataset.filter;const layer=target.closest('.sx-sheet');if(layer)modelMenu(app);else paint(app,true);return}
    if(action==='default'){if(s.running)return;const m=s.models.find(x=>x.id===target.dataset.id);if(!m)return;s.defaultId=m.id;m.selected=true;syncSelection(app);toast(app,`${m.name} 已设为默认`);save(app);return}
    if(action==='model'){editModel(app,target.dataset.id);return}
    if(action==='models'){modelMenu(app);return}
    if(action==='preview'){preview(app);return}
    if(action==='enable'){target.disabled=true;target.innerHTML=icon('loader-circle')+'正在启用…';initIcons();setTimeout(()=>{s.running=true;s.direct=false;closeSheet(app);paint(app,true);const link=app.querySelector('.sx-statuslink');if(link)link.innerHTML='<span class="sx-dot"></span><span>路由已启用</span>';app.querySelector('.sx-connection-strip')?.classList.add('sx-flowing');toast(app,'路由已启用，可以启动新的 Codex 会话');save(app)},650);return}
    if(action==='launch'){toast(app,s.direct?'演示：使用 DeepSeek 直连启动新 Codex 会话':'演示：打开使用当前模型菜单的新 Codex 会话');return}
    if(action==='restore'){restore(app);return}
    if(action==='confirm-restore'){s.running=false;s.direct=false;closeSheet(app);paint(app,true);const statusLink=app.querySelector('.sx-statuslink');if(statusLink)statusLink.innerHTML='<span class="sx-dot"></span><span>待启用</span>';toast(app,'已恢复原配置，本地路由已停止');return}
    if(action==='save-model'){const field=app.querySelector('[name="model-name"]');if(!field.value.trim()){field.focus();return}s.models.find(m=>m.id===s.editing).name=field.value.trim().slice(0,48);closeSheet(app);paint(app);toast(app,'模型修改已保存，下次发布时应用');return}
    if(action==='provider'){provider(app,target.dataset.provider);return}
    if(action==='add-provider'){addProvider(app);return}
    if(action==='provider-next'){const isApi=app.querySelector('[name="provider-type"]').selectedIndex===0;provider(app,isApi?'DeepSeek':'ChatGPT');return}
    if(action==='save-provider'){closeSheet(app);toast(app,'连接已保存，可返回工作台预览启用');return}
    if(action==='check-provider'){target.disabled=true;target.textContent='检查中…';setTimeout(()=>{if(!target.isConnected)return;target.disabled=false;target.innerHTML=icon('check')+'检查通过 · 演示';initIcons()},650);return}
    if(action==='direct'){sheet(app,'预览直连',`<p class="sx-helper">只使用 DeepSeek 的默认模型。应用前显示配置变化，原配置保留恢复点。</p><div class="sx-diff"><div class="sx-plus">+ model = "deepseek-flash"</div><div class="sx-plus">+ model_provider = "deepseek"</div></div><div class="sx-notice">直连不经过本地模型路由。此流程为设计演示。</div>`,button('应用直连','direct-apply','sx-button sx-primary'));return}
    if(action==='direct-apply'){s.running=true;s.direct=true;s.defaultId='deepseek-flash';closeSheet(app);paint(app,true);const link=app.querySelector('.sx-statuslink');if(link)link.innerHTML='<span class="sx-dot"></span><span>直连已启用</span>';toast(app,'演示：直连配置已应用，可从状态入口恢复');return}
    if(action==='account'||action==='import-account'){if(action==='import-account'){toast(app,'演示：读取当前账号前显示身份与工作区确认');return}account(app);return}
    if(action==='add-model'){addModel(app);return}
    if(action==='save-new-model'){const id=app.querySelector('[name="new-model-id"]').value.trim(),name=app.querySelector('[name="new-model-name"]').value.trim(),p=app.querySelector('[name="new-model-provider"]').value;const error=app.querySelector('[data-form-error]');if(!/^[a-zA-Z0-9._/-]{1,60}$/.test(id)||!name){error.textContent='填写模型 ID 和显示名称。ID 使用字母、数字、点、短横线或斜线。';error.style.color='var(--sx-red)';return}if(s.models.some(m=>m.id===id)){error.textContent='这个公开 ID 已存在，请换一个。';error.style.color='var(--sx-red)';return}s.models.push({id,name:name.slice(0,48),provider:p,meta:'手动映射 · 演示',selected:true});closeSheet(app);paint(app,true);toast(app,'模型已加入菜单');return}
    if(action==='command'){command(app);return}
    if(action==='status'){showStatus(app);return}
    if(action==='refresh'){toast(app,'请求列表已刷新 · 演示数据');return}
    if(action==='request'){const cancelled=target.dataset.request==='2';sheet(app,'请求详情',`<span class="sx-pill ${cancelled?'sx-wait':''}">${cancelled?'已取消':'已完成'}</span><div class="sx-detail-line"><span>模型</span><span>${target.dataset.request==='1'?'Codex · 主力':'DeepSeek Flash'}</span></div><div class="sx-detail-line"><span>用时</span><span>${cancelled?'0.6 s':'1.8 s'}</span></div><div class="sx-detail-line"><span>结束状态</span><span>${cancelled?'客户端取消':'response.completed'}</span></div><div class="sx-notice">仅保留必要的请求元数据，内容与凭据不进入此视图。</div>`,button('关闭','close','sx-button sx-primary'),'REQUEST / DEMO');return}
    if(action==='workspace'){sheet(app,'Codex 工作空间','<label class="sx-field">配置目录<input class="sx-input" name="workspace" value="/Users/demo/.codex"></label><p class="sx-helper">切换目录前检查待恢复配置；路径只在此演示中使用。</p>',button('保存目录','save-settings','sx-button sx-primary'));return}
    if(action==='common'){sheet(app,'通用配置','<p class="sx-helper">普通设置供连接继承；凭据、模型路由及 MCP 保留在各自入口。</p><label class="sx-field">默认思考等级<select class="sx-select"><option>跟随模型目录</option><option>high</option><option>medium</option></select></label><div class="sx-settingrow"><div><strong>使用通用配置</strong><p>由各个连接选择是否继承。</p></div><label class="sx-toggle"><input type="checkbox" checked aria-label="使用通用配置"><span></span></label></div>',button('保存','save-settings','sx-button sx-primary'));return}
    if(action==='save-settings'){closeSheet(app);toast(app,'演示设置已确认');return}
    if(action==='mcp'||action==='skills'){sheet(app,action==='mcp'?'MCP 服务':'Skills',`<div class="sx-pill">规划内容</div><div class="sx-step"><span>1</span><div>列表按工作空间组织<small>显示来源、路径与启用状态</small></div></div><div class="sx-step"><span>2</span><div>右侧展开详情<small>查看信息，再决定是否编辑</small></div></div><div class="sx-step"><span>3</span><div>变更前显示差异<small>写入前确认影响范围</small></div></div>`,button('返回','close','sx-button sx-primary'));return}
  });
  root.addEventListener('change',event=>{const app=event.target.closest('.sx');if(!app)return;const s=state.get(app);if(event.target.matches('[data-model-check]')){if(s.running)return;const m=s.models.find(x=>x.id===event.target.dataset.modelCheck);m.selected=event.target.checked;if(m.id===s.defaultId&&!m.selected)s.defaultId=s.models.find(x=>x.selected)?.id||'';if(!s.defaultId&&m.selected)s.defaultId=m.id;syncSelection(app);save(app)}if(event.target.matches('[data-motion]')){tweaks.motion=event.target.checked;root.querySelectorAll('.sx').forEach(app=>app.classList.toggle('sx-reduced',!tweaks.motion));toast(app,tweaks.motion?'已启用过渡动画':'已减少动态效果')}});
  root.addEventListener('input',event=>{if(event.target.name==='command-search'){const q=event.target.value.toLowerCase();event.target.closest('.sx-sheet').querySelectorAll('[data-search-label]').forEach(b=>b.hidden=!b.dataset.searchLabel.toLowerCase().includes(q))}});
  root.addEventListener('keydown',event=>{const app=event.target.closest('.sx');if(!app)return;const layer=app.querySelector('.sx-sheet-layer');if(event.key==='Escape'&&layer.classList.contains('sx-open')){event.preventDefault();closeSheet(app)}if(event.key==='Tab'&&layer.classList.contains('sx-open')){const controls=[...layer.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)')].filter(el=>!el.hidden&&el.offsetParent!==null);const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}});
  document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();const app=activeApp&&!activeApp.closest('section[data-variant]').hidden?activeApp:root.querySelector('section[data-variant]:not([hidden]) .sx');if(app)command(app)}});
  window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState?.privateContent?.appearance;if(['system','light','dark'].includes(value)){tweaks.appearance=value;appearance()}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{appearance();root.querySelectorAll('.sx').forEach(app=>{const content=app.querySelector('[data-content]');if(content)content.style.padding=tweaks.density+'px'})}});tweak.addSelect(tweaks,'appearance',{label:'外观',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});tweak.addToggle(tweaks,'motion',{label:'过渡动画'});tweak.addSlider(tweaks,'density',{label:'页面留白',min:20,max:40,step:2,unit:'px'})}
})();
</script>
