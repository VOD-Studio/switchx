name: Check and build releases

on:
  workflow_call:
    inputs:
      release-tag:
        description: Build release packages after validating this version tag
        type: string
        default: ''
    outputs:
      version:
        description: Validated workspace version
        value: ${{ jobs.check.outputs.version }}
      prerelease:
        description: Whether the version is a prerelease
        value: ${{ jobs.check.outputs.prerelease }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version, formatting, Clippy and tests
    # Repository variable USE_SELF_HOSTED_RUNNER=true moves this job to a self-hosted
    # runner (labels from SELF_HOSTED_RUNNER_LABELS, a JSON array). Fork pull requests
    # always stay on GitHub-hosted runners because this repository is public.
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON(vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","linux","x64"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Prepare the CI container
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates curl git git-lfs sudo python3 python-is-python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ''
          cache-key: check
      - name: Validate version, lockfile and changelog
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--tag "$RELEASE_TAG" --notes-output target/release-notes.md)
          fi
          version=$(python scripts/release.py check "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install the pinned Slint formatter
        run: cargo install slint-lsp --version 1.18.1 --locked
      - name: Check formatting, lint and run all tests
        run: make check
      - name: Upload release notes
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: target/release-notes.md
          if-no-files-found: error
          retention-days: 7

  native:
    name: ${{ matrix.target }}
    if: inputs.release-tag != ''
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      # Windows portable packages must not require a separate VC++ runtime install.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: native-${{ matrix.target }}
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --target "$RUST_TARGET" -- -D warnings
      - name: Run unit and integration tests
        run: cargo test --locked --workspace --target "$RUST_TARGET"
      - name: Build and package the native release binary
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py --target "$RUST_TARGET"
      - name: Upload native packages and checksums (including Linux AppImages)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
