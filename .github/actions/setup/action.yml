name: Set up native Rust build
description: Install the pinned toolchain and Linux GUI dependencies, then restore the Rust cache
inputs:
  python-version:
    description: Python version to install, or empty to use the container's Python
    default: '3.12'
  cache-key:
    description: Separate CI check and native build caches
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          build-essential cmake pkg-config libfontconfig1-dev \
          libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
          libwayland-dev libx11-dev libgl1-mesa-dev fonts-dejavu-core \
          squashfs-tools desktop-file-utils imagemagick
    - name: Install the repository Rust toolchain
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none --no-modify-path
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup show
    - name: Cache Rust build dependencies
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.event_name == 'push' }}
